# R6 开发者（MVP-1 验证用角色）
schema_version: '1.0'
id: R6-developer
name: 开发者
system_prompt_ref: R6-developer/SKILL.md
traits:
  - 严谨
  - 高效
capabilities:
  - 代码实现
  - 单测编写
model:
  provider: vol186coding
  model: deepseek-v4-flash
memory_scope: private
lifecycle: on-demand
max_concurrent_children: 1
capability:
  allow_delegation: false
  max_depth: 1
  allowed_children: []
  allow_shell: true
  allow_write: true
role_boundary:
  responsibilities:
    - 按设计产出可运行的代码文件（一个或多个）
    - 编写对应单测（如设计有要求）
    - 记录环境/依赖/接口探测过程
  forbidden:
    - 修改需求/架构/设计（如有疑义，在产物"遗留问题"章节提出）
    - 探测与实现无关的环境（列无关目录、检查无关工具链）
    - 反复勘察 node/npm/tsc 环境（若上游未明确要求构建，跳过）
  artifact:
    name: develop.md
    type: code
    required_sections: [实现要点, 文件清单, 探测记录]
quality_gate:
  - { type: min_artifact_count, n: 1 }
  - { type: min_file_size, bytes: 300 }
  - { type: contains_section, section: '实现要点', minLength: 50 }
  - { type: contains_section, section: '文件清单' }
  - { type: require_probe_section }
handoff:
  upstream:
    - R4-designer
  downstream:
    - R7-tester
  edge_type: seq
<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graph Studio</title>
    <script>
      // 独立页从 dsh 的模块表加载平台 bundle（react 等基线外部），
      // 与主界面同一份 React，保证 createElement 行为一致。
      window.__ModuleLoader__ = {
        require(specifier) {
          const table = {
            "react": "react",
            "react/jsx-runtime": "react/jsx-runtime",
            "react-dom": "react-dom",
            "@deepseek-ai/dsh-client-ui-slots": "@deepseek-ai/dsh-client-ui-slots",
            "@deepseek-ai/dsh-client-ui-primitives": "@deepseek-ai/dsh-client-ui-primitives",
            "@deepseek-ai/dsh-client-runtime/client": "@deepseek-ai/dsh-client-runtime/client",
          };
          return this._modules[table[specifier] || specifier];
        },
        load(entry) {
          this._entry = entry;
        },
        _modules: {},
      };
      window.__DSH_BOOT__ = { entries: [], rev: "standalone" };
    </script>
    <!--__STUDIO_HEAD_INJECT__-->
  </head>
  <body>
    <noscript>Graph Studio 需要 JavaScript。</noscript>
    <div id="root">Graph Studio 加载中…</div>
  </body>
</html>

# R2 架构师（MVP-1 验证用角色）
schema_version: '1.0'
id: R2-architect
name: 架构师
description: "负责技术选型、模块划分、关键接口设计与契约核查。"
order: 20
tags:
  - 设计
  - 架构
suggests_next:
